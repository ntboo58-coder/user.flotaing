<!DOCTYPE html>
<html>
<head>
<meta charset='UTF-8'>
<style>
* {
   box-sizing: border-box;
   user-select: none;
   -webkit-user-select: none;
}
:root {
   --primary-color: #ff1f3d;
   --primary-glow: rgba(255, 31, 61, 0.35);
}
body { 
   margin: 0;
   padding: 0;
   background: transparent;
   font-family: 'Segoe UI', Roboto, Helvetica, sans-serif;
   overflow: hidden;
}
.main-panel {
   background: radial-gradient(circle at top, rgba(20, 15, 22, 0.98), rgba(8, 6, 10, 0.99)); 
   color: #fff; 
   padding: 12px; 
   height: 100vh;
   max-height: 320px; 
   display: flex;
   flex-direction: column;
   border: 1px solid var(--primary-color); 
   border-radius: 14px; 
   box-shadow: 0 0 25px var(--primary-glow), inset 0 0 15px rgba(255, 255, 255, 0.05); 
   overflow: hidden; 
   position: relative;
   transform: translateZ(0);
}
.top-bar { 
   display: flex; 
   justify-content: space-between; 
   align-items: center; 
   margin-bottom: 10px; 
   border-bottom: 1px solid rgba(255, 255, 255, 0.1); 
   padding-bottom: 8px; 
   flex-shrink: 0; 
}
.brand-container { 
   display: flex; 
   align-items: center; 
   gap: 9px; 
}
.logo-img { 
   width: 30px; 
   height: 30px; 
   border-radius: 8px; 
   object-fit: cover; 
   border: 1px solid var(--primary-color); 
   box-shadow: 0 0 10px var(--primary-glow);
}
.title-group { 
   display: flex; 
   flex-direction: column; 
}
.header { 
   color: var(--primary-color); 
   font-size: 13px; 
   font-weight: 900; 
   letter-spacing: 1.2px; 
   text-shadow: 0 0 10px var(--primary-glow); 
}
.dev-credit { 
   color: #00ffcc; 
   font-family: 'Courier New', Courier, monospace;
   font-size: 9.5px; 
   font-weight: 700; 
   letter-spacing: 0.6px; 
   text-shadow: 0 0 6px rgba(0, 255, 204, 0.5);
}
.right-controls {
   display: flex;
   align-items: center;
   gap: 8px;
}
.online-indicator {
   display: flex;
   align-items: center;
   gap: 5px;
   background: rgba(0, 255, 136, 0.08);
   border: 1px solid rgba(0, 255, 136, 0.3);
   padding: 3px 7px;
   border-radius: 7px;
}
.online-dot {
   width: 6px;
   height: 6px;
   background-color: #00ff88;
   border-radius: 50%;
   box-shadow: 0 0 8px #00ff88;
   animation: pulse-green 1.5s infinite;
}
.online-text {
   color: #00ff88;
   font-size: 8.5px;
   font-weight: 800;
   letter-spacing: 0.8px;
}
@keyframes pulse-green {
   0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 255, 136, 0.7); }
   70% { transform: scale(1); box-shadow: 0 0 0 5px rgba(0, 255, 136, 0); }
   100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 255, 136, 0); }
}
.window-controls { 
   display: flex; 
   gap: 5px; 
}
.ctrl-btn { 
   background: rgba(35, 30, 40, 0.8); 
   color: #bbb; 
   border: 1px solid rgba(255, 255, 255, 0.1); 
   width: 23px; 
   height: 23px; 
   border-radius: 6px; 
   font-size: 11px; 
   font-weight: bold; 
   cursor: pointer; 
   display: flex; 
   align-items: center; 
   justify-content: center; 
   transition: all 0.2s; 
}
.ctrl-btn:active { background: #555; color: #fff; }
.ctrl-btn.palette {
   background: rgba(255, 0, 128, 0.15);
   color: #ff0080;
   border-color: rgba(255, 0, 128, 0.4);
   font-size: 13px;
}
.ctrl-btn.close { 
   background: rgba(255, 31, 61, 0.2); 
   color: var(--primary-color); 
   border-color: rgba(255, 31, 61, 0.4); 
}
.settings-overlay {
   position: absolute;
   top: 0;
   left: 0;
   width: 100%;
   height: 100%;
   background: rgba(12, 10, 15, 0.97);
   backdrop-filter: blur(6px);
   z-index: 10;
   display: none;
   flex-direction: column;
   padding: 14px;
   border-radius: 14px;
   animation: fadeIn 0.2s ease-in-out;
}
@keyframes fadeIn {
   from { opacity: 0; transform: scale(0.97); }
   to { opacity: 1; transform: scale(1); }
}
.settings-header {
   display: flex;
   justify-content: space-between;
   align-items: center;
   border-bottom: 1px solid rgba(255, 255, 255, 0.12);
   padding-bottom: 8px;
   margin-bottom: 12px;
   color: #fff;
   font-size: 12px;
   font-weight: 800;
   letter-spacing: 1px;
}
.color-picker-group {
   display: flex;
   flex-direction: column;
   gap: 10px;
}
.color-label {
   font-size: 10px;
   color: #b0b0b0;
   font-weight: 700;
   letter-spacing: 0.5px;
}
.sketchware-picker-box {
   display: flex;
   align-items: center;
   justify-content: space-between;
   background: rgba(25, 20, 30, 0.9);
   padding: 10px 14px;
   border-radius: 10px;
   border: 1px solid rgba(255, 255, 255, 0.15);
   box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5);
}
.color-preview-circle {
   width: 28px;
   height: 28px;
   border-radius: 50%;
   border: 2px solid #fff;
   box-shadow: 0 0 10px var(--primary-color);
   transition: background 0.2s;
}
.color-input-hidden {
   position: absolute;
   opacity: 0;
   width: 0;
   height: 0;
}
.color-btn-trigger {
   background: linear-gradient(135deg, #ff1f3d, #cc0033);
   color: #fff;
   border: none;
   padding: 6px 14px;
   border-radius: 6px;
   font-size: 10px;
   font-weight: 800;
   cursor: pointer;
   letter-spacing: 0.5px;
   box-shadow: 0 0 8px rgba(255, 31, 61, 0.4);
}
.color-btn-trigger:active {
   transform: scale(0.95);
}
.color-code-display {
   color: #00ffcc;
   font-family: 'Courier New', Courier, monospace;
   font-size: 11px;
   font-weight: bold;
}
.scroll-container {
   overflow-y: auto;
   overflow-x: hidden;
   flex-grow: 1;
   padding-right: 2px;
}
.scroll-container::-webkit-scrollbar {
   width: 3px;
}
.scroll-container::-webkit-scrollbar-thumb {
   background: var(--primary-color);
   border-radius: 3px;
}

/* ===== ডাউনলোড সেকশন ===== */
.download-section {
   background: linear-gradient(135deg, rgba(28, 22, 30, 0.9), rgba(16, 12, 18, 0.95));
   border: 1px solid rgba(0, 255, 136, 0.12);
   border-radius: 12px;
   padding: 14px 16px;
   margin-bottom: 10px;
}
.download-section .top-row {
   display: flex;
   justify-content: space-between;
   align-items: center;
}
.download-section .label {
   font-size: 11px;
   font-weight: 600;
   color: #ddd;
}
.download-section .label .icon { margin-right: 6px; }
.download-section .status-text {
   font-size: 9px;
   font-weight: 700;
   color: #00ff88;
}
.download-btn {
   background: linear-gradient(135deg, #00cc88, #00aa66);
   color: #fff;
   border: none;
   padding: 8px 22px;
   border-radius: 8px;
   font-size: 10px;
   font-weight: 800;
   cursor: pointer;
   letter-spacing: 0.5px;
   box-shadow: 0 0 20px rgba(0, 204, 136, 0.2);
   transition: all 0.3s;
   width: 100%;
   margin-top: 8px;
}
.download-btn:active { transform: scale(0.95); }
.download-btn:disabled {
   opacity: 0.5;
   cursor: not-allowed;
   box-shadow: none;
}

/* ===== প্রোগ্রেস বার ===== */
.progress-wrap {
   margin-top: 10px;
   display: none;
}
.progress-bar-bg {
   width: 100%;
   height: 6px;
   background: rgba(255,255,255,0.05);
   border-radius: 10px;
   overflow: hidden;
}
.progress-bar-fill {
   height: 100%;
   width: 0%;
   background: linear-gradient(90deg, var(--primary-color), #00ff88);
   border-radius: 10px;
   transition: width 0.3s;
}
.progress-info {
   display: flex;
   justify-content: space-between;
   margin-top: 4px;
   font-size: 8px;
   color: #888;
}
.progress-percent {
   color: #00ff88;
   font-weight: 700;
}

/* ===== নরমাল বাটন ===== */
.panel-btn { 
   background: linear-gradient(90deg, rgba(28, 22, 30, 0.85), rgba(16, 12, 18, 0.85)); 
   color: #ddd; 
   border: 1px solid rgba(255, 255, 255, 0.08); 
   padding: 11px 13px; 
   width: 100%; 
   border-radius: 9px; 
   margin-bottom: 8px; 
   text-align: left; 
   font-size: 11px; 
   font-weight: 600; 
   cursor: pointer; 
   display: flex; 
   justify-content: space-between; 
   align-items: center; 
   transition: all 0.25s ease; 
}
.panel-btn:active { transform: scale(0.97); }
.panel-btn.active { 
   border-color: var(--primary-color); 
   background: linear-gradient(90deg, var(--primary-glow), rgba(16, 12, 18, 0.9)); 
   color: #fff; 
   box-shadow: 0 0 12px var(--primary-glow); 
}
.panel-btn .status { 
   font-size: 9.5px; 
   font-weight: 800; 
   padding: 3px 8px; 
   border-radius: 5px; 
   background: rgba(0, 0, 0, 0.5); 
   color: #777; 
   border: 1px solid rgba(255, 255, 255, 0.06); 
   letter-spacing: 0.5px;
}
.panel-btn.active .status { 
   background: var(--primary-color); 
   color: #fff; 
   box-shadow: 0 0 8px var(--primary-color); 
}

/* ===== কালারিং বাটন ===== */
.color-btn-premium { 
   background: linear-gradient(90deg, rgba(28, 22, 30, 0.85), rgba(16, 12, 18, 0.85)); 
   color: #ddd; 
   border: 1px solid rgba(255, 255, 255, 0.08); 
   padding: 11px 13px; 
   width: 100%; 
   border-radius: 9px; 
   margin-bottom: 8px; 
   text-align: left; 
   font-size: 11px; 
   font-weight: 600; 
   cursor: pointer; 
   display: flex; 
   justify-content: space-between; 
   align-items: center; 
   transition: all 0.25s ease; 
   position: relative;
}
.color-btn-premium:active { transform: scale(0.97); }
.color-btn-premium.active { 
   border-color: var(--primary-color); 
   background: linear-gradient(90deg, var(--primary-glow), rgba(16, 12, 18, 0.9)); 
   color: #fff; 
   box-shadow: 0 0 12px var(--primary-glow); 
}
.color-btn-premium .color-status { 
   font-size: 9.5px; 
   font-weight: 800; 
   padding: 3px 8px; 
   border-radius: 5px; 
   background: rgba(0, 0, 0, 0.5); 
   color: #777; 
   border: 1px solid rgba(255, 255, 255, 0.06); 
   letter-spacing: 0.5px;
}
.color-btn-premium.active .color-status { 
   background: var(--primary-color); 
   color: #fff; 
   box-shadow: 0 0 8px var(--primary-color); 
}
.color-drop-wrap {
   position: relative;
   display: inline-block;
}
.color-trigger {
   background: rgba(0,0,0,0.3);
   border: 1px solid rgba(255,255,255,0.06);
   border-radius: 5px;
   padding: 2px 6px;
   font-size: 10px;
   color: #aaa;
   cursor: pointer;
   display: flex;
   align-items: center;
   gap: 5px;
}
.color-trigger:hover {
   border-color: rgba(255,255,255,0.15);
}
.color-dot-small {
   width: 16px;
   height: 16px;
   border-radius: 50%;
   border: 1px solid rgba(255,255,255,0.1);
}
.color-drop-menu {
   position: absolute;
   top: 100%;
   right: 0;
   margin-top: 4px;
   background: rgba(18, 14, 24, 0.98);
   backdrop-filter: blur(12px);
   border: 1px solid rgba(255, 255, 255, 0.1);
   border-radius: 8px;
   padding: 4px;
   z-index: 50;
   display: none;
   flex-direction: column;
   min-width: 130px;
   box-shadow: 0 8px 30px rgba(0,0,0,0.8);
}
.color-drop-menu.open {
   display: flex;
}
.color-drop-item {
   display: flex;
   align-items: center;
   gap: 8px;
   padding: 4px 8px;
   border-radius: 5px;
   cursor: pointer;
   font-size: 10px;
   color: #ccc;
}
.color-drop-item:hover {
   background: rgba(255,255,255,0.06);
}
.color-drop-item .dot {
   width: 16px;
   height: 16px;
   border-radius: 50%;
   border: 1px solid rgba(255,255,255,0.1);
}
.color-drop-item .android-id {
   margin-left: auto;
   font-size: 8px;
   color: #00ffcc;
   background: rgba(0,255,204,0.1);
   padding: 0 6px;

}
.color-drop-item.selected {
   background: rgba(255,31,61,0.15);
}
.color-drop-item.selected .android-id {
   background: var(--primary-color);
   color: #fff;
}
.loading-box {
   display: flex;
   flex-direction: column;
   align-items: center;
   justify-content: center;
   height: 100%;
   padding-top: 30px;
}
.premium-spinner {
   width: 34px;
   height: 34px;
   border: 3px solid rgba(255, 255, 255, 0.1);
   border-top: 3px solid var(--primary-color);
   border-radius: 50%;
   animation: spin 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
   box-shadow: 0 0 15px var(--primary-glow);
   margin-bottom: 12px;
}
@keyframes spin {
   0% { transform: rotate(0deg); }
   100% { transform: rotate(360deg); }
}
.status-msg {
   color: var(--primary-color);
   font-size: 10px;
   font-weight: 800;
   letter-spacing: 1.2px;
   text-shadow: 0 0 8px var(--primary-glow);
}
.offline-screen {
   display: none;
   flex-direction: column;
   align-items: center;
   justify-content: center;
   height: 100%;
   text-align: center;
   padding: 20px;
}
.offline-logo-container {
   position: relative;
   width: 65px;
   height: 65px;
   margin: 0 auto 15px auto;
   background: radial-gradient(circle, rgba(255, 0, 85, 0.2) 0%, rgba(11, 13, 23, 0.8) 70%);
   border: 2px solid var(--primary-color);
   border-radius: 50%;
   display: flex;
   justify-content: center;
   align-items: center;
   box-shadow: 0 0 20px var(--primary-glow);
   animation: pulseIcon 2.5s infinite ease-in-out;
}
@keyframes pulseIcon {
   0% { transform: scale(1); box-shadow: 0 0 15px var(--primary-glow); }
   50% { transform: scale(1.05); box-shadow: 0 0 25px var(--primary-glow); }
   100% { transform: scale(1); box-shadow: 0 0 15px var(--primary-glow); }
}
.offline-svg {
   width: 32px;
   height: 32px;
   fill: none;
   stroke: var(--primary-color);
   stroke-width: 1.8;
   stroke-linecap: round;
   stroke-linejoin: round;
   filter: drop-shadow(0 0 8px var(--primary-glow));
}
.offline-title {
   font-size: 13px;
   color: var(--primary-color);
   text-shadow: 0 0 8px var(--primary-glow);
   margin-bottom: 6px;
   letter-spacing: 1.2px;
   font-weight: 900;
}
.offline-desc {
   color: #a0aec0;
   font-size: 9px;
   line-height: 1.4;
   margin-bottom: 15px;
}
.retry-btn {
   width: 100%;
   max-width: 200px;
   padding: 8px;
   background: linear-gradient(45deg, var(--primary-color), #b3003b);
   border: none;
   color: #fff;
   font-weight: bold;
   font-size: 9px;
   border-radius: 7px;
   cursor: pointer;
   box-shadow: 0 0 10px var(--primary-glow);
   transition: 0.3s;
   letter-spacing: 1px;
}
.retry-btn:hover {
   box-shadow: 0 0 18px var(--primary-glow);
}
</style>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

<div class="main-panel">
    <div class="settings-overlay" id="colorOverlay">
        <div class="settings-header">
            <span>THEME COLOR PICKER</span>
            <button class="ctrl-btn close" onclick="toggleColorPicker(false)">✕</button>
        </div>
        <div class="color-picker-group">
            <span class="color-label">SKETCHWARE PRO ENGINE:</span>
            <div class="sketchware-picker-box">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <div class="color-preview-circle" id="previewCircle" style="background: #ff1f3d;"></div>
                    <span class="color-code-display" id="colorCodeDisplay">#FF1F3D</span>
                </div>
                <input type="color" id="nativeColorInput" class="color-input-hidden" value="#ff1f3d" oninput="applyCustomColor(this.value)">
                <button class="color-btn-trigger" onclick="document.getElementById('nativeColorInput').click()">SELECT COLOR</button>
            </div>
        </div>
    </div>

    <div class='top-bar'>
       <div class='brand-container'>
           <img src='https://i.postimg.cc/tgXQ16bS/Logo.png' class='logo-img'>
           <div class='title-group'>
               <div class='header'>GHOST X PANEL</div>
               <div class='dev-credit'>&lt;/&gt; NEAMOT BHAI</div>
           </div>
       </div>

       <div class="right-controls">
           <div class="online-indicator" id="onlineIndicatorBox">
               <div class="online-dot" id="onlineDot"></div>
               <span class="online-text" id="onlineText">ONLINE</span>
           </div>
           <div class='window-controls'>
               <button class='ctrl-btn palette' onclick='toggleColorPicker(true)' title='Theme Color Picker'>🎨</button>
               <button class='ctrl-btn' onclick='controlWindow(88)'>-</button>
               <button class='ctrl-btn close' onclick='controlWindow(99)'>✕</button>
           </div>
       </div>
    </div>

    <div class="scroll-container" id="button-container">
        <!-- ===== ডাউনলোড সেকশন ===== -->
        <div class="download-section" id="downloadSection">
            <div class="top-row">
                <span class="label"><span class="icon">📥</span> DOWNLOAD FILE</span>
                <span class="status-text" id="downloadStatus">Ready</span>
            </div>
            <button class="download-btn" id="downloadBtn" onclick="startAutoDownload()">DOWNLOAD</button>
            <div class="progress-wrap" id="progressWrap">
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="progressFill"></div>
                </div>
                <div class="progress-info">
                    <span id="progressSize">0 KB / 0 KB</span>
                    <span class="progress-percent" id="progressPercent">0%</span>
                </div>
            </div>
        </div>

        <div class="loading-box" id="loader-box">
            <div class="premium-spinner"></div>
            <div class="status-msg" id="loading-status-text">CONNECTING TO SERVER...</div>
        </div>
    </div>

    <div class="offline-screen" id="offlineScreen">
        <div class="offline-logo-container">
            <svg class="offline-svg" viewBox="0 0 24 24">
                <path d="M1 1l22 22M16.72 11.06A10.94 10.94 0 0 1 19 12.55M5 12.55a10.94 10.94 0 0 1 5.17-2.39M10.71 5.05A16 16 0 0 1 22.58 9M2 9a16 16 0 0 1 9.29-3.95M8.53 16.11a6 6 0 0 1 6.95 0M12 20h.01"></path>
            </svg>
        </div>
        <div class="offline-title">CONNECTION LOST</div>
        <div class="offline-desc">No internet connection detected. Network features have been disabled.</div>
        <button class="retry-btn" onclick="checkNetworkStatus()">RELOAD CONNECTION</button>
    </div>
</div>

<script>
// ===== গ্লোবাল =====
let selectedColors = {};
let buttonData = {};
let fileData = {};

// ===== ফাইল ইনফো =====
let FILE_URL = "https://github.com/ntboo58-coder/File-/releases/download/v1.00/hs.zip";
let FILE_NAME = "hs.zip";
let FILE_SIZE = 1216348;

// ===== অটো ডাউনলোড (WebView এর ভিতরে) =====
function startAutoDownload() {
    const btn = document.getElementById('downloadBtn');
    const status = document.getElementById('downloadStatus');
    const progressWrap = document.getElementById('progressWrap');
    const progressFill = document.getElementById('progressFill');
    const progressPercent = document.getElementById('progressPercent');
    const progressSize = document.getElementById('progressSize');

    btn.disabled = true;
    btn.textContent = '⏳ DOWNLOADING...';
    status.textContent = 'Connecting...';
    progressWrap.style.display = 'block';
    progressFill.style.width = '0%';
    progressPercent.textContent = '0%';
    progressSize.textContent = '0 KB / ' + formatSize(FILE_SIZE);

    // ===== অ্যান্ড্রয়েড ব্রিজ ব্যবহার করে ডাউনলোড (WebView এর ভিতর) =====
    if (window.AndroidBridge) {
        // ডাউনলোড শুরু করার জন্য Android মেথড কল
        if (window.AndroidBridge.startDownload) {
            window.AndroidBridge.startDownload(FILE_URL, FILE_NAME);
            
            // Android থেকে প্রোগ্রেস আপডেট আসবে
            window.updateDownloadProgress = function(percent, downloaded, total) {
                progressFill.style.width = percent + '%';
                progressPercent.textContent = Math.round(percent) + '%';
                progressSize.textContent = formatSize(downloaded) + ' / ' + formatSize(total);
                status.textContent = 'Downloading... ' + Math.round(percent) + '%';
                
                if (percent >= 100) {
                    btn.textContent = '✅ COMPLETE';
                    status.textContent = '✅ Downloaded!';
                    setTimeout(() => {
                        btn.textContent = 'DOWNLOAD';
                        btn.disabled = false;
                        progressWrap.style.display = 'none';
                        status.textContent = 'Ready';
                    }, 3000);
                }
            };
        } else {
            // ফালব্যাক: পুরনো পদ্ধতি
            window.AndroidBridge.downloadFile(FILE_URL, FILE_NAME);
            simulateProgress();
        }
    } else {
        // ===== WebView এ ডাউনলোড (Android এর JavaScript Interface) =====
        // WebView এর জন্য HTML5 ডাউনলোড
        try {
            var xhr = new XMLHttpRequest();
            xhr.open('GET', FILE_URL, true);
            xhr.responseType = 'blob';
            
            xhr.onprogress = function(e) {
                if (e.lengthComputable) {
                    var percent = (e.loaded / e.total) * 100;
                    progressFill.style.width = percent + '%';
                    progressPercent.textContent = Math.round(percent) + '%';
                    progressSize.textContent = formatSize(e.loaded) + ' / ' + formatSize(e.total);
                    status.textContent = 'Downloading... ' + Math.round(percent) + '%';
                }
            };
            
            xhr.onload = function() {
                if (xhr.status === 200) {
                    var blob = xhr.response;
                    var link = document.createElement('a');
                    link.href = window.URL.createObjectURL(blob);
                    link.download = FILE_NAME;
                    link.click();
                    window.URL.revokeObjectURL(link.href);
                    
                    progressFill.style.width = '100%';
                    progressPercent.textContent = '100%';
                    status.textContent = '✅ Downloaded!';
                    btn.textContent = '✅ COMPLETE';
                    setTimeout(() => {
                        btn.textContent = 'DOWNLOAD';
                        btn.disabled = false;
                        progressWrap.style.display = 'none';
                        status.textContent = 'Ready';
                    }, 3000);
                }
            };
            
            xhr.onerror = function() {
                status.textContent = '❌ Download failed';
                btn.textContent = 'DOWNLOAD';
                btn.disabled = false;
                progressWrap.style.display = 'none';
            };
            
            xhr.send();
        } catch(e) {
            // ফালব্যাক: ডাইরেক্ট ডাউনলোড
            var link = document.createElement('a');
            link.href = FILE_URL;
            link.download = FILE_NAME;
            link.click();
            simulateProgress();
        }
    }
}

// ===== সিমুলেটেড প্রোগ্রেস (ফালব্যাক) =====
function simulateProgress() {
    let progress = 0;
    const interval = setInterval(() => {
        progress += Math.random() * 12 + 3;
        if (progress > 100) progress = 100;
        
        document.getElementById('progressFill').style.width = progress + '%';
        document.getElementById('progressPercent').textContent = Math.round(progress) + '%';
        document.getElementById('progressSize').textContent = formatSize((progress / 100) * FILE_SIZE) + ' / ' + formatSize(FILE_SIZE);
        
        if (progress >= 100) {
            clearInterval(interval);
            const btn = document.getElementById('downloadBtn');
            btn.textContent = '✅ COMPLETE';
            document.getElementById('downloadStatus').textContent = '✅ Downloaded!';
            setTimeout(() => {
                btn.textContent = 'DOWNLOAD';
                btn.disabled = false;
                document.getElementById('progressWrap').style.display = 'none';
                document.getElementById('downloadStatus').textContent = 'Ready';
            }, 3000);
        }
    }, 350);
}

// ===== ফাইল সাইজ ফরম্যাট =====
function formatSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / 1048576).toFixed(1) + ' MB';
}

// ===== Firebase থেকে ফাইল ডেটা লোড =====
if (navigator.onLine) {
    const firebaseConfig = {
        databaseURL: "https://test-795b1-default-rtdb.firebaseio.com"
    };
    firebase.initializeApp(firebaseConfig);
    const dbRef = firebase.database().ref("panel_buttons");
    const fileRef = firebase.database().ref("panel_files");

    fileRef.on("value", (snapshot) => {
        if (snapshot.exists()) {
            const data = snapshot.val();
            if (data && data.url) {
                FILE_URL = data.url;
                FILE_NAME = data.name || 'file.zip';
                FILE_SIZE = data.size || 1216348;
                document.getElementById('downloadStatus').textContent = 'Ready';
                document.getElementById('downloadBtn').disabled = false;
            }
        }
    });

    dbRef.on("value", (snapshot) => {
        if (!navigator.onLine) return;
        const container = document.getElementById("button-container");

        if (snapshot.exists()) {
            let hasVisibleButton = false;
            let tempHtml = "";
            buttonData = {};

            snapshot.forEach((childSnapshot) => {
                const btnData = childSnapshot.val();
                const isActive = btnData.active !== undefined ? btnData.active : true;

                if (isActive) {
                    hasVisibleButton = true;
                    const btnIndex = btnData.index || 0;
                    const btnName = btnData.name;
                    const btnType = btnData.type || "normal";
                    
                    buttonData[btnIndex] = btnData;

                    if (btnType === "color") {
                        const colors = btnData.colors || [];
                        if (colors.length === 0) {
                            colors.push({ hex: '#ff1f3d', label: 'Red', androidIndex: 1 });
                            colors.push({ hex: '#00ff88', label: 'Green', androidIndex: 2 });
                            colors.push({ hex: '#ffaa00', label: 'Yellow', androidIndex: 3 });
                        }

                        const selectedIdx = selectedColors[btnIndex] || 0;
                        const selectedColor = colors[selectedIdx] || colors[0];

                        let dropItems = '';
                        colors.forEach((color, idx) => {
                            const sel = (idx === selectedIdx) ? 'selected' : '';
                            const androidId = color.androidIndex || (idx + 1);
                            dropItems += `
                                <div class="color-drop-item ${sel}" onclick="event.stopPropagation(); selectColor(${btnIndex}, ${idx})">
                                    <span class="dot" style="background:${color.hex};"></span>
                                    <span>${color.label || 'Color'}</span>
                                    <span class="android-id">#${androidId}</span>
                                </div>
                            `;
                        });

                        const activeClass = (selectedColors[btnIndex] !== undefined && selectedColors[btnIndex] !== null) ? 'active' : '';

                        tempHtml += `
                            <div class="color-btn-premium ${activeClass}" id="colorWrapper_${btnIndex}">
                                <span>${btnName}</span>
                                <div style="display:flex;align-items:center;gap:6px;">
                                    <div class="color-drop-wrap">
                                        <div class="color-trigger" onclick="event.stopPropagation(); toggleMenu(${btnIndex})">
                                            <span class="color-dot-small" id="dot_${btnIndex}" style="background:${selectedColor.hex};"></span>
                                            <span>▼</span>
                                        </div>
                                        <div class="color-drop-menu" id="menu_${btnIndex}">
                                            ${dropItems}
                                        </div>
                                    </div>
                                    <span class="color-status" id="status_${btnIndex}">${activeClass ? 'ON' : 'OFF'}</span>
                                </div>
                            </div>
                        `;
                    } else {
                        tempHtml += `
                            <button class="panel-btn" onclick="handleButtonClick(this, ${btnIndex})">
                                <span>${btnName}</span>
                                <span class='status'>OFF</span>
                            </button>
                        `;
                    }
                }
            });

            const downloadSection = document.getElementById('downloadSection').outerHTML;
            
            if (hasVisibleButton) {
                container.innerHTML = downloadSection + tempHtml;
            } else {
                container.innerHTML = downloadSection + `
                    <div class="loading-box">
                        <div class="status-msg" style="color: #777;">NO ACTIVE BUTTONS</div>
                    </div>
                `;
            }
        } else {
            container.innerHTML = `
                <div class="loading-box">
                    <div class="premium-spinner"></div>
                    <div class="status-msg">SYNCING DATABASE...</div>
                </div>
            `;
        }
    });
} else {
    showOfflineMode();
}

// ===== অন্যান্য ফাংশন =====
window.onload = function() {
    const savedColor = localStorage.getItem('panel_custom_color');
    if (savedColor) {
        updateThemeVariables(savedColor);
        document.getElementById('nativeColorInput').value = savedColor;
        document.getElementById('colorCodeDisplay').innerText = savedColor.toUpperCase();
        document.getElementById('previewCircle').style.background = savedColor;
    }
    checkNetworkStatus();
}

window.addEventListener('online', () => {
    checkNetworkStatus();
    location.reload();
});
window.addEventListener('offline', showOfflineMode);

function checkNetworkStatus() {
    if (!navigator.onLine) showOfflineMode();
}

function showOfflineMode() {
    const indicatorBox = document.getElementById('onlineIndicatorBox');
    const onlineDot = document.getElementById('onlineDot');
    const onlineText = document.getElementById('onlineText');
    
    indicatorBox.style.background = 'rgba(255, 31, 61, 0.08)';
    indicatorBox.style.border = '1px solid rgba(255, 31, 61, 0.3)';
    onlineDot.style.backgroundColor = '#ff1f3d';
    onlineDot.style.boxShadow = '0 0 8px #ff1f3d';
    onlineText.style.color = '#ff1f3d';
    onlineText.innerText = 'OFFLINE';

    document.getElementById('button-container').style.display = 'none';
    document.getElementById('offlineScreen').style.display = 'flex';
}

function toggleColorPicker(show) {
    const overlay = document.getElementById('colorOverlay');
    overlay.style.display = show ? 'flex' : 'none';
}

function hexToRgba(hex, alpha) {
    let c = hex.replace('#', '');
    if (c.length === 3) c = c.split('').map(x => x + x).join('');
    const num = parseInt(c, 16);
    return `rgba(${num >> 16}, ${(num >> 8) & 255}, ${num & 255}, ${alpha})`;
}

function updateThemeVariables(hexColor) {
    const glowColor = hexToRgba(hexColor, 0.35);
    document.documentElement.style.setProperty('--primary-color', hexColor);
    document.documentElement.style.setProperty('--primary-glow', glowColor);
}

function applyCustomColor(hexColor) {
    updateThemeVariables(hexColor);
    document.getElementById('colorCodeDisplay').innerText = hexColor.toUpperCase();
    document.getElementById('previewCircle').style.background = hexColor;
    localStorage.setItem('panel_custom_color', hexColor);
}

function handleButtonClick(btnElement, btnIndex) {
    if (!navigator.onLine) return;
    btnElement.classList.toggle('active');
    let statusSpan = btnElement.querySelector('.status');
    if (btnElement.classList.contains('active')) { 
        statusSpan.innerText = 'ON'; 
    } else { 
        statusSpan.innerText = 'OFF'; 
    }
    if (window.AndroidBridge) { 
        window.AndroidBridge.performNativeClick(btnIndex); 
    }
}

function toggleMenu(btnIndex) {
    const menu = document.getElementById(`menu_${btnIndex}`);
    if (!menu) return;
    document.querySelectorAll('.color-drop-menu').forEach(m => {
        if (m.id !== `menu_${btnIndex}`) m.classList.remove('open');
    });
    menu.classList.toggle('open');
}

function selectColor(btnIndex, colorIndex) {
    if (!navigator.onLine) return;
    selectedColors[btnIndex] = colorIndex;
    const btnData = buttonData[btnIndex];
    if (!btnData) return;
    const colors = btnData.colors || [];
    const color = colors[colorIndex] || colors[0];
    const androidId = color.androidIndex || (colorIndex + 1);
    const dot = document.getElementById(`dot_${btnIndex}`);
    if (dot) dot.style.background = color.hex;
    const menu = document.getElementById(`menu_${btnIndex}`);
    if (menu) {
        const items = menu.querySelectorAll('.color-drop-item');
        items.forEach((item, idx) => {
            if (idx === colorIndex) item.classList.add('selected');
            else item.classList.remove('selected');
        });
        menu.classList.remove('open');
    }
    const wrapper = document.getElementById(`colorWrapper_${btnIndex}`);
    if (wrapper) {
        wrapper.classList.add('active');
        const status = document.getElementById(`status_${btnIndex}`);
        if (status) status.innerText = 'ON';
        if (window.AndroidBridge) {
            window.AndroidBridge.performNativeClick(androidId);
        }
    }
}

document.addEventListener('click', function(e) {
    if (!e.target.closest('.color-drop-wrap')) {
        document.querySelectorAll('.color-drop-menu').forEach(m => m.classList.remove('open'));
    }
});

function controlWindow(actionCode) {
   if (window.AndroidBridge) { 
       window.AndroidBridge.performNativeClick(actionCode); 
   }
}
</script>
